server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index login.html;

    # [SEC] La GUI real no maneja secretos (JWT vive en sessionStorage del browser,
    # ver auth.js) — estos headers son endurecimiento estándar, no mitigación de un
    # riesgo específico detectado.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Desactivar listado de directorios explícitamente (nginx lo trae off por
    # defecto, pero se declara para que quede documentado, no implícito).
    autoindex off;
}
