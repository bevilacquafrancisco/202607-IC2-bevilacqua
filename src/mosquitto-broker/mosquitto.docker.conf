# mosquitto.docker.conf — Brazo Robótico Pick & Place v5.0
# Variante de mosquitto.conf para correr DENTRO del contenedor Docker.
#
# [DISEÑO] No se modifica mosquitto.conf original: ese sigue siendo el que usa
# ARRANCAR_SISTEMA.ps1 para arranque nativo en Windows (rutas C:/...). Esta
# variante usa las rutas estándar de la imagen oficial eclipse-mosquitto
# (/mosquitto/config, /mosquitto/data, /mosquitto/log), montadas como volúmenes
# en docker-compose.yml. password_file y acl_file SÍ deben seguir siendo el
# mismo passwd/acl.conf que ya generaste — no se duplica ese contenido.

# -----------------------------------------------------------------------------
# LISTENER 1 — TCP para el ESP32 físico o el simulador (puerto 1883)
# -----------------------------------------------------------------------------
listener 1883
protocol mqtt

# -----------------------------------------------------------------------------
# LISTENER 2 — WebSocket para la GUI (puerto 9001)
# -----------------------------------------------------------------------------
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# AUTENTICACIÓN GLOBAL (aplica a ambos listeners sin per_listener_settings)
# -----------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# -----------------------------------------------------------------------------
# LOGGING
# [AJUSTE DOCKER] Se agrega log_dest stdout además del archivo, para que
# `docker compose logs mosquitto` muestre actividad en vivo — con solo
# log_dest file, los logs quedarían "invisibles" para docker compose logs.
# -----------------------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# -----------------------------------------------------------------------------
# PERSISTENCIA
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# -----------------------------------------------------------------------------
# KEEPALIVE
# -----------------------------------------------------------------------------
max_keepalive 120
